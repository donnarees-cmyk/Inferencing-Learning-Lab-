<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inferencing Learning Lab — Grade 6</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3fb;color:#172c46;font:17px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}header{background:#123660;color:#fff;padding:24px 5vw}header h1{margin:0;font-size:clamp(26px,4vw,40px)}header p{margin:5px 0}.shell{max-width:1000px;margin:26px auto;padding:0 18px}.panel{background:#fff;border-radius:20px;padding:clamp(20px,4vw,34px);box-shadow:0 8px 24px #15345b13;margin-bottom:18px}h2{margin-top:0}h3{margin-bottom:7px}.tag{background:#dceaf8;color:#17416b;border-radius:25px;padding:5px 12px;font-size:13px;font-weight:700}.bar{height:11px;background:#dae5f0;border-radius:10px;overflow:hidden;margin:12px 0 22px}.bar>div{height:100%;background:#2876c4;transition:width .2s}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:12px 18px;background:#1265b2;color:white;font-size:16px;font-weight:700;cursor:pointer}.btn.secondary{background:#e6effa;color:#164d85}.btn:disabled{opacity:.46;cursor:not-allowed}.voice{border:1px solid #a9c8e7;background:white;color:#164d85;padding:8px 12px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700}.passage{background:#f5f8fc;border-left:5px solid #428ad0;border-radius:10px;padding:20px;line-height:1.9;white-space:pre-line}.choice{display:block;border:2px solid #d9e4ef;padding:13px 15px;border-radius:12px;margin:10px 0;cursor:pointer;background:#fff}.choice:has(input:checked){border-color:#1c72ba;background:#e9f5ff}.choice input{margin-right:10px;transform:scale(1.16)}.feedback{padding:14px;border-radius:12px;margin-top:15px;background:#eef5fd}.good{background:#e5f7eb}.warn{background:#fff1de}.quiet{color:#526783;font-size:14px}.foot{margin-top:20px;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}.bigscore{font-size:52px;font-weight:800;color:#1265b2;margin:0}input[type=text]{font-size:17px;border:1px solid #a8b8c9;border-radius:10px;padding:12px;width:100%;max-width:400px}.pill{font-size:14px;color:#164d85;font-weight:700}.smallbox{background:#eff7fe;padding:15px;border-radius:12px;margin:12px 0}@media print{.btn,.voice,header,.bar{display:none}body{background:white}.panel{box-shadow:none}}</style></head><body><header><h1>🔍 Inferencing Learning Lab</h1><p>Grade 6 • Florida B.E.S.T. • Independent 30-minute activity</p></header><main class="shell" id="root"></main><script>const data={"passages": [{"title": "The Empty Display Case", "text": "When Maya entered the school library, a velvet cushion sat inside the glass display case, but the silver medal usually resting on it was gone. A small sign read, 'History Exhibit Opens Friday.' Mrs. Lin stood nearby with a soft cloth and a cardboard box. 'The glass needed polishing before our guests arrive,' she said. Maya noticed the medal's blue ribbon peeking from the box. Mrs. Lin locked the case and carried the box toward the storage room.", "qs": [["What can Maya infer about the missing medal?", ["It has been stolen.", "Mrs. Lin moved it while cleaning.", "It was awarded to a student.", "The exhibit has been canceled."], 1, "Mrs. Lin has a box with the medal ribbon and mentions polishing the case."], ["Which detail best supports that inference?", ["The sign says the exhibit opens Friday.", "Maya entered the library.", "The blue ribbon peeked from Mrs. Lin’s box.", "The case is made of glass."], 2, "The matching ribbon directly connects the box to the medal."], ["Why does Mrs. Lin polish the glass?", ["She expects visitors to see the exhibit.", "She plans to throw away the case.", "She is hiding a cracked window.", "She wants to give the medal away."], 0, "The upcoming exhibit and the mention of guests suggest preparation for visitors."], ["Which conclusion is NOT supported by the passage?", ["Mrs. Lin has access to the display case.", "The medal normally sits on a cushion.", "The exhibit is scheduled for Friday.", "Maya won the silver medal."], 3, "Nothing indicates Maya won the medal."], ["What is the strongest inference about Mrs. Lin’s actions?", ["She is preparing the display for the exhibit.", "She is moving the exhibit to another school.", "She has forgotten that Friday is coming.", "She dislikes the medal’s ribbon."], 0, "Cleaning the glass and safely moving the medal point to preparation."]]}, {"title": "A Different Route", "text": "On Tuesday, Leo waited at the usual bus stop. The road ahead was lined with orange cones, and a crew worked beside a deep trench. The school bus arrived eight minutes later than normal. Instead of turning right at Oak Street, the driver continued straight. 'We'll still get there before the bell,' she said. Several students looked at the cones through the back window, then settled into their seats.", "qs": [["Why did the driver most likely change the route?", ["To show students a new neighborhood.", "To avoid road construction.", "To stop for a snack.", "To visit another school."], 1, "Cones and a trench indicate construction blocking or delaying the usual route."], ["Which two details together most strongly support that inference?", ["Orange cones and the driver continuing straight.", "Tuesday and the school bell.", "Students sitting and looking out windows.", "The bus stop and the driver speaking."], 0, "Construction markers plus an unusual turn connect the route change to roadwork."], ["What can readers reasonably infer from the driver’s words?", ["She knows students may worry about being late.", "She wants everyone to miss class.", "She has never driven the route before.", "She expects school to be closed."], 0, "Reassuring students they will arrive before the bell addresses a concern about lateness."], ["Which statement is a direct observation rather than an inference?", ["The driver dislikes traffic.", "Road repairs will last for a month.", "The bus came eight minutes late.", "The students were angry with the crew."], 2, "The passage explicitly states the bus came eight minutes later than normal."], ["What is the best supported prediction?", ["The bus will take an alternate street that morning.", "The bus will stop at the construction trench.", "The driver will cancel all future trips.", "The students will walk to school."], 0, "The driver already avoided the usual turn and intends to reach school."]]}, {"title": "Seeds on the Windowsill", "text": "For two weeks, Nia placed two identical pots on the classroom windowsill. Both received the same amount of soil and water. She placed one behind a thick cardboard screen that blocked much of the sunlight. The other stood in direct light. By the tenth day, the plant behind the screen was pale and leaned toward a narrow gap in the cardboard. The plant in the light had sturdy green leaves. Nia photographed both plants and wrote a note: 'Next time, test light only.'", "qs": [["What can Nia infer about the pale plant?", ["It may not be getting enough light.", "It has received too much fertilizer.", "Its pot is too large.", "It is older than the other plant."], 0, "The key changed condition is light exposure; the shaded plant is pale."], ["Why might the shaded plant lean toward the gap?", ["It is reaching toward available sunlight.", "It is growing away from water.", "It is trying to leave its pot.", "It is copying the other plant."], 0, "The gap allows some light, making growth toward it a reasonable inference."], ["Which detail makes the light explanation especially convincing?", ["Nia took photographs.", "The pots got equal soil and water.", "The classroom had a windowsill.", "The experiment lasted two weeks."], 1, "Keeping soil and water equal helps isolate the influence of light."], ["What does Nia’s note suggest about her next experiment?", ["She wants to control other variables carefully.", "She plans to stop measuring growth.", "She will remove all plants from the classroom.", "She thinks pictures are useless."], 0, "Testing light only means controlling the conditions other than light."], ["Which inference goes beyond the available evidence?", ["Different light conditions may affect plant growth.", "The shaded plant had paler leaves.", "Sunlight might matter for sturdy growth.", "All plant species need exactly the same sunlight."], 3, "A comparison of two plants cannot establish the needs of every species."]]}, {"title": "The Last Rehearsal", "text": "The auditorium was almost empty when Amir stepped onto the stage. He checked the index cards in his pocket for a third time, then whispered the opening sentence of his speech. In the front row, his friend Elena lifted two thumbs. Amir breathed slowly and looked past the seats toward the clock. When the music teacher called, 'Five minutes!' he tucked the cards away, squared his shoulders, and walked to the curtain. Earlier that week, Amir had told Elena he hoped to speak without reading every word.", "qs": [["How is Amir most likely feeling at the beginning?", ["Nervous about speaking.", "Angry with the music teacher.", "Bored by the auditorium.", "Certain the event was canceled."], 0, "Repeatedly checking cards and whispering a line suggests nerves."], ["What does Elena’s gesture most likely communicate?", ["She wants Amir to leave.", "She is encouraging Amir.", "She cannot hear the teacher.", "She dislikes his speech."], 1, "Two thumbs up is a positive, supportive response in this context."], ["Which detail best supports the idea that Amir is trying to become confident?", ["The auditorium has seats.", "The teacher calls out a time.", "He takes a breath and squares his shoulders.", "He has a friend named Elena."], 2, "Controlled breathing and upright posture suggest he is preparing himself."], ["Why does Amir put his cards away before walking to the curtain?", ["He may be trying to deliver his speech from memory.", "He wants Elena to read the speech instead.", "He thinks his cards are missing.", "He wants to end the rehearsal early."], 0, "His earlier goal was to speak without reading every word."], ["Which claim is not justified by the passage?", ["Amir practiced the start of his speech.", "Elena was present in the auditorium.", "Amir wants to rely less on his cards.", "Amir won first place in a speech contest."], 3, "No contest result is mentioned."]]}], "practice": [{"text": "Rain tapped the windows. Jordan grabbed an umbrella before stepping outside.", "q": "What is the most reasonable inference?", "options": ["Jordan expects to get wet without protection.", "Jordan is going swimming.", "Jordan has lost a jacket.", "Jordan dislikes windows."], "answer": 0, "why": "The rain and umbrella are clues; experience tells us umbrellas help keep people dry."}, {"text": "The cafeteria lights were off, the tables had been wiped clean, and a sign on the door read “Closed for the day.”", "q": "Which conclusion is supported?", "options": ["Lunch is about to begin.", "The cafeteria has finished serving meals.", "The school has no food.", "Workers are repainting the walls."], "answer": 1, "why": "The sign and cleaned tables support that service has ended."}, {"text": "Ava’s hands shook slightly as she held the audition form. She read the instructions twice before entering the music room.", "q": "Which text evidence best supports an inference that Ava is nervous?", "options": ["Ava is near a music room.", "There is an audition form.", "Her hands shook slightly.", "She entered the room."], "answer": 2, "why": "Shaking hands are the strongest direct clue to nervousness."}, {"text": "The dog waited beside its empty bowl and looked up each time someone entered the kitchen.", "q": "What might the dog want?", "options": ["A walk in the rain.", "A new collar.", "A quiet room.", "Food in its bowl."], "answer": 3, "why": "The empty bowl and watching people in the kitchen suggest hunger."}]};
let stage='start', pi=0, qi=0, answers=Array(20).fill(null), practiceAnswers=Array(4).fill(null), student='';
const root=document.getElementById('root');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speak(t){if(!('speechSynthesis' in window)){alert('Text to speech is not supported in this browser. Try Chrome or Safari.');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.87;let v=speechSynthesis.getVoices();u.voice=v.find(x=>x.name.toLowerCase().includes('google us english'))||v.find(x=>x.lang.toLowerCase()==='en-us')||v.find(x=>x.lang.toLowerCase().startsWith('en'))||null;speechSynthesis.speak(u)}
function stop(){if('speechSynthesis' in window)speechSynthesis.cancel()}
function voice(t,label='🔊 Read aloud'){return `<button class="voice" data-speak="${esc(t)}">${label}</button>`}
function radio(options,name,selected){return options.map((o,i)=>`<label class="choice"><input type="radio" name="${name}" value="${i}" ${selected===i?'checked':''}><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}
function wrap(content,progress=0){root.innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="tag">Florida Grade 6 · ELA.K12.EE.3.1</span><span class="pill">${Math.round(progress)}% complete</span></div><div class="bar"><div style="width:${progress}%"></div></div>${content}</div>`;root.querySelectorAll('[data-speak]').forEach(b=>b.addEventListener('click',()=>speak(b.getAttribute('data-speak'))));root.querySelectorAll('input[type=radio]').forEach(x=>x.addEventListener('change',change))}
function change(e){const i=+e.target.value;if(stage==='practice'){practiceAnswers[pi]=i;render()}else if(stage==='quiz'){answers[qi]=i;document.getElementById('next').disabled=false}}
function render(){stop();if(stage==='start'){wrap(`<h2>Welcome to the Inferencing Learning Lab!</h2><p>Complete this activity independently. You will learn how to make logical inferences, practice using clues, and finish with a 20-question quiz.</p>${voice('Welcome to the Inferencing Learning Lab. Work independently. First learn the skill, then practice, and finally complete a twenty question quiz. You can listen to any directions, passage, question, or answer choices by selecting Read Aloud.','🔊 Read directions')}<div class="smallbox"><b>30-minute plan</b><p>Learn: 5 minutes · Practice: 5 minutes · Read and quiz: 20 minutes.</p><b>Steps</b><p>1. Type your first and last name. 2. Complete the teaching and practice. 3. Answer all twenty quiz questions. 4. Screenshot your score for Canvas.</p></div><label><b>First and last name</b><br><input id="student" type="text" autocomplete="name" placeholder="First Last" value="${esc(student)}"></label><div class="foot"><span class="quiet">Headphones recommended. Voice availability depends on your device.</span><button class="btn" id="begin">Begin Lab →</button></div>`,0);document.getElementById('begin').onclick=()=>{student=document.getElementById('student').value.trim();if(student.split(/\s+/).length<2){alert('Please enter your first and last name.');return}stage='teach';render()};return}
if(stage==='teach'){let lines=[['What is an inference?','An inference is a reasonable conclusion you make by combining clues from the text with what you already know.'],['The formula','Text clues plus what I know equals a logical inference.'],['Model it','Text: “Rosa placed her soaking shoes by the door and shook rain from her coat.” Clue: soaking shoes and a wet coat. What I know: rain makes clothing wet. Inference: Rosa has been outside in rainy weather.'],['Evidence matters','Choose details that directly support the inference. Avoid wild guesses or conclusions that go beyond what the text says.'],['Check your thinking','Ask: Which words are the clues? What does my background knowledge add? Does my conclusion fit all the details?']];let c=`<h2>Learn: Be a Text Detective</h2><p>Read or listen to each mini-lesson. Think about the modeled example before moving on.</p>${voice(lines.map(a=>a.join('. ')).join(' '),'🔊 Read whole mini-lesson')}`+lines.map((a,i)=>`<div class="smallbox"><h3>${i+1}. ${a[0]}</h3><p>${esc(a[1])}</p>${voice(a[1],'🔊 Listen')}</div>`).join('')+`<div class="foot"><button class="btn secondary" id="back">← Back</button><button class="btn" id="go">Start practice →</button></div>`;wrap(c,10);document.getElementById('back').onclick=()=>{stage='start';render()};document.getElementById('go').onclick=()=>{stage='practice';pi=0;render()};return}
if(stage==='practice'){let p=data.practice[pi],sel=practiceAnswers[pi],done=sel!==null;let c=`<h2>Practice: Try it yourself</h2><div class="pill">Practice ${pi+1} of 4 · Feedback is available before the quiz</div><p><b>Read the text:</b></p><div class="passage">${esc(p.text)}</div>${voice(p.text,'🔊 Read text')}<h3>${esc(p.q)}</h3>${voice(p.q+' Options. '+p.options.map((o,i)=>String.fromCharCode(65+i)+'. '+o).join('. '),'🔊 Read question and choices')}${radio(p.options,'p',sel)}${done?`<div class="feedback ${sel===p.answer?'good':'warn'}"><b>${sel===p.answer?'Well done!':'Look more closely at the clues.'}</b> ${esc(p.why)} ${voice(p.why,'🔊 Hear explanation')}</div>`:''}<div class="foot"><button class="btn secondary" id="back">← Previous</button><button class="btn" id="next" ${!done?'disabled':''}>${pi===3?'Start 20-question quiz →':'Next practice →'}</button></div>`;wrap(c,20+pi*6);document.getElementById('back').onclick=()=>{if(pi>0)pi--;else stage='teach';render()};document.getElementById('next').onclick=()=>{if(pi<3)pi++;else{stage='quiz';qi=0}render()};return}
if(stage==='quiz'){const pidx=Math.floor(qi/5),qidx=qi%5,p=data.passages[pidx],q=p.qs[qidx],selected=answers[qi];let c=`<h2>Final Quiz: Show What You Know</h2><div class="pill">Question ${qi+1} of 20 · Passage ${pidx+1} of 4</div><h3>${esc(p.title)}</h3>${voice(p.title+'. '+p.text,'🔊 Read passage')}<div class="passage">${esc(p.text)}</div><h3>${esc(q[0])}</h3>${voice(q[0],'🔊 Read question')}${voice('Answer choices. '+q[1].map((o,i)=>String.fromCharCode(65+i)+'. '+o).join('. '),'🔊 Read choices')}${radio(q[1],'q',selected)}<p class="quiet">Choose the strongest answer using evidence from the passage. Answers are not revealed until you submit.</p><div class="foot"><button class="btn secondary" id="back">← Previous</button><button class="btn" id="next" ${selected===null?'disabled':''}>${qi===19?'Submit quiz & view score':'Next question →'}</button></div>`;wrap(c,45+qi*2.7);document.getElementById('back').onclick=()=>{if(qi>0)qi--;else {stage='practice';pi=3}render()};document.getElementById('next').onclick=()=>{if(answers[qi]===null)return;if(qi<19)qi++;else if(confirm('Submit all 20 answers? You will see your final score.'))stage='results';render()};return}
if(stage==='results'){let count=0;data.passages.forEach((p,j)=>p.qs.forEach((q,k)=>{if(answers[j*5+k]===q[2])count++}));let date=new Date().toLocaleString('en-US');let c=`<h2>Inferencing Learning Lab — Complete!</h2><p class="bigscore">${count} / 20</p><h3>${Math.round(count/20*100)}%</h3><div class="smallbox"><p><b>Student:</b> ${esc(student)}</p><p><b>Completed:</b> ${date}</p><p><b>Skill:</b> Making inferences and using textual evidence</p><p><b>Florida standard:</b> ELA.K12.EE.3.1</p></div><p><b>Take a screenshot of this screen and upload it to Canvas.</b></p>${voice(`Congratulations ${student}. Your inferencing lab is complete. You scored ${count} out of 20, or ${Math.round(count/20*100)} percent. Please screenshot your score for Canvas.`,'🔊 Read results')}<div class="foot"><button class="btn secondary" id="review">Review quiz answers</button><button class="btn" id="print">Print or Save Result</button></div>`;wrap(c,100);document.getElementById('print').onclick=()=>window.print();document.getElementById('review').onclick=()=>{stage='review';render()};return}
if(stage==='review'){let c='<h2>Review your responses</h2><p>See the correct answers and explanations to improve your inferencing skills.</p>';data.passages.forEach((p,j)=>{c+=`<h3>${esc(p.title)}</h3>`;p.qs.forEach((q,k)=>{let ix=j*5+k,correct=answers[ix]===q[2];c+=`<div class="smallbox"><b>${ix+1}. ${esc(q[0])}</b><p>Your answer: ${esc(q[1][answers[ix]])} ${correct?'✓':'✗'}</p><p>Best answer: ${esc(q[1][q[2]])}</p><p>${esc(q[3])}</p></div>`})});c+='<button class="btn" id="score">← Return to score</button>';wrap(c,100);document.getElementById('score').onclick=()=>{stage='results';render()};return}}
window.addEventListener('beforeunload',e=>{if(stage==='quiz'){e.preventDefault();e.returnValue=''}});if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}render();</script></body></html>
